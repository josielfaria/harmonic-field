<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campos Harmônicos</title>
    <link rel="icon" type="image/x-icon" href="./assets/images/favicon.ico">

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>

    <!-- STYLES -->
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <div class="container-fluid mt-5">
      <h1 class="mb-4 text-center">Campos Harmônicos</h1>

      <!-- Navigation tabs -->
      <ul class="nav nav-tabs mb-4" id="harmonicTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button
            class="nav-link active"
            id="major-tab"
            data-bs-toggle="tab"
            data-bs-target="#major"
            type="button"
          >
            Tonalidades Maiores
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="minor-tab"
            data-bs-toggle="tab"
            data-bs-target="#minor"
            type="button"
          >
            Tonalidades Menores
          </button>
        </li>
      </ul>

      <div class="tab-content" id="harmonicTabContent">
        <!-- Major keys -->
        <div class="tab-pane fade show active" id="major" role="tabpanel">
          <div class="row" id="majorKeysContainer">
            <!-- Major keys will be generated here -->
          </div>
        </div>

        <!-- Minor keys -->
        <div class="tab-pane fade" id="minor" role="tabpanel">
          <div class="row" id="minorKeysContainer">
            <!-- Minor keys will be generated here -->
          </div>
        </div>
      </div>

      <!-- SCRIPTS -->
      <script src="scripts/main.js"></script>
    </div>
  </body>
</html>
